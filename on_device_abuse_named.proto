edition = "2023";

// The ON_DEVICE_ABUSE Clearcut log source: reports from Google's on-device
// abuse (spam/scam) classifier library com.google.android.libraries.abuse.hades.moirai
// ("Moirai") as built into Google Messages. Moirai downloads encrypted, signed
// rule and model packages ("protections", Persephone service), checks them
// against a binary-transparency log, and classifies messages on the device.
// Each event reports one of: a classification verdict (field 1), the unpacking
// of a downloaded package (3) or a package download (4), always with a common
// header (2). Nothing in the payload is message content.
//
// Schema from the Messages APKs in the Pixel 8 factory images
// (messages.android_20240130 and messages.android_20240903; obfuscated class
// names in comments as January / September build). The logger is
// cfcl / ckkt (log source "ON_DEVICE_ABUSE"). The outer LogEvent is GMS's,
// as in client_logging_named.proto. Names are from the code that sets each
// field; "estimated name" marks names the code does not settle.

option features.utf8_validation = NONE;

message OnDeviceAbuse_LogEntry {  // crai (GMS)
  int64 currentTimeMillis = 1;
  string packageName = 2;
  repeated craj keyValuePairList = 3;
  MoiraiLog moirai_log = 6;  // wire type bytes
  int32 eventId = 11;
  int64 eventFlowId = 12;
  sint64 timeZoneOffset = 15;
  ExperimentIds experiment_ids = 16;
  int64 elapsedRealtime = 17;
  bytes veProducerByteString = 18;
  crah_a f19 = 19;
  repeated int32 f20 = 20 [features.repeated_field_encoding = EXPANDED];
  int64 bootCount = 22;
  NetworkConnectionInfo network_connection_info = 23;
  bool notDirectBootMode = 25;
  double applied_sampling_rate = 30;  // only sent when flag ClearcutLogOperation__applied_sampling_rate is on; 1 = not sampled
}

// One Moirai event; the logger sets the header and exactly one of fields 1, 3, 4.
// Message name estimated (medium): Moirai is the library's name.
message MoiraiLog {  // qdm / otf
  ClassificationLog classification = 1;  // logger a(): a classification verdict; estimated name (high)
  ClientMetadata client_metadata = 2;  // built by logger d() from the "moiraiMetadataProvider" state; estimated name (medium)
  ProtectionsExtractionLog protections_extraction = 3;  // logger c(), from DefaultProtectionsExtractor; estimated name (medium)
  ProtectionDownloadLog protection_download = 4;  // logger b(), from PersephoneDownloadWorker ("download status to provide to protectionDownload")
}

// Common header. Fields 1, 2 and 8 are in the January build only, field 10 in the
// September build only; a June 2024 Messages sends 1, 2, 6, 7, 9 and 10.
message ClientMetadata {  // qdk / otd
  uint64 classification_count = 1;  // classifications run so far (persisted counter, +1 per MoiraiExecutor.classify)
  uint64 download_count = 2;  // protection packages downloaded so far (persisted counter, +1 per successful download)
  string package_name = 6;  // Context.getPackageName() of the app hosting Moirai
  // The protection token of the last downloaded package: DownloadBlobResponse
  // getProtectionToken(), stored as received and never parsed by the client. It
  // labels which server rule/model package produced a verdict ("Protection token
  // is %s, classification verdict is %s"). Opaque server-issued bytes: the one
  // captured (150 bytes) starts with 01 d6 00 09 1c, the form of Tink's output
  // prefix (version 1 + 4-byte key ID), then 145 random-looking bytes, so likely
  // a Tink ciphertext or MAC made by the server.
  bytes protection_token = 7;
  // First 4 bytes (Guava HashCode.asInt) of SHA-256 of the client's Tink public
  // key, the key the protections are encrypted to. With probability 1/4 replaced
  // by a random int (randomised response). estimated name (high)
  uint32 public_key_hash = 8;
  int64 client_build_version = 9;  // a constant in the logger: 602681988 (Jan 2024), 670502775 (Sep 2024); grows with build date like a Google changelist number. estimated name (medium)
  int64 client_role = 10;  // the Moirai client's role string (ClientId(packageName, role)) parsed as a number, 0 if empty
}

message ClassificationLog {  // qdg / osz, from the classify result (cfey)
  repeated ClassifierResult classifier_result = 1;  // one per model / rule set run
  Verdict verdict = 2;
  uint64 latency_ms = 3;  // Stopwatch time of the whole classification, milliseconds
  UserFeedback user_feedback = 4;  // the user's action on the message, when the verdict is logged after it
}

message Verdict {  // qdu / otp, from cfed: "Verdict(pv=..., action=...)"
  PolicyViolation policy_violation = 1;  // Tartarus output "policy_violation"
  Action action = 2;
}

// Stored as the code's 1-based value minus one.
enum PolicyViolation {
  UNKNOWN_POLICY_VIOLATION = 0;
  NO_POLICY_VIOLATION = 1;  // also "NONE"
  UNSUPPORTED_POLICY_VIOLATION = 2;  // also "NOT_SUPPORTED"
  NOT_AVAILABLE_POLICY_VIOLATION = 3;  // also "NOT_AVAILABLE": classification disabled by config
  GIFT_CARD = 4;
  PHISHING = 5;
  SUSPICIOUS = 6;
}

// Kotlin enum cfcz / cklg {NONE, WARN, HIDE, UNKNOWN, NOT_AVAILABLE, DELETE}, mapped
// by the logger (ckkz.a()) and stored minus one.
enum Action {
  ACTION_UNKNOWN = 0;
  ACTION_NOT_AVAILABLE = 1;
  ACTION_NONE = 2;
  ACTION_WARN = 3;
  ACTION_HIDE = 4;
  ACTION_DELETE = 5;
}

enum UserFeedback {  // Java enum qeb / otz (names kept)
  USER_FEEDBACK_UNKNOWN = 0;
  USER_FEEDBACK_MARKED_NOT_SPAM = 1;
  USER_FEEDBACK_MARKED_SPAM = 2;
  USER_FEEDBACK_CONFIRMED_SPAM = 3;
  USER_FEEDBACK_LEFT_SPAM = 4;
  USER_FEEDBACK_DELETED_SPAM = 5;
  USER_FEEDBACK_BLOCKED_SPAM = 6;
}

message ClassifierResult {  // qdi / otb, from cfeu
  string label = 1;  // the classifier's name (cewy "label"); "tartarus" for the rule engine
  string version = 2;  // cewy "version"; "v0" for the rule engine
  uint64 latency_ms = 4;  // Stopwatch time of this classifier, milliseconds
  repeated ClassifierScore score = 6;  // the model's output map, label -> score
  RulesOutput rules_output = 7;  // rule engine only
}

message ClassifierScore {  // qde / osx, one entry of a Map<String, Float>
  string label = 1;
  float score = 2;
}

message RulesOutput {  // qdc / osv
  string log = 2;  // the Tartarus rule script's "output/log" string
}

message ProtectionsExtractionLog {  // qdq / otj
  ExtractionResult extraction = 3;  // estimated name (medium)
  CorruptedProtections corrupted_protections = 4;  // September build only (ckod); estimated name (high)
}

// Unpacking a downloaded package (SCAR: rule script + models), DefaultProtectionsExtractor.
message ExtractionResult {  // qds / otl
  bool no_rule_script = 1;  // true when the package had no rule script ("No rule script extracted from SCAR."); estimated name (medium)
  uint64 latency_ms = 2;  // Stopwatch time of decrypting and unpacking, milliseconds
}

message CorruptedProtections {  // otn
  bool corrupted = 1;  // always true: the stored package failed to parse ("Corrupted bytes detected. Deleting file to force new download.")
}

// PersephoneDownloadWorker.doWork(), one per scheduled download.
message ProtectionDownloadLog {  // qdo / oth
  DownloadResult result = 1;
  uint64 duration_ms = 2;  // clock time from the start of doWork() to the package being stored, milliseconds
  BinaryTransparencyCheck binary_transparency = 3;
  DownloadType download_type = 4;
}

// Stored as the worker's value minus one.
enum DownloadResult {
  DOWNLOAD_RESULT_UNSPECIFIED = 0;
  DOWNLOAD_SUCCEEDED = 1;  // package verified and stored
  DOWNLOAD_REJECTED = 2;  // ProtectionsPersistence.d() did not store the package: binary-transparency check failed, or a partial update with no stored package; estimated name (high)
  DOWNLOAD_FAILED = 3;  // "Persephone sync failed" (exception; retried)
}

// The server's DownloadBlobResponse status (doic), as named in the worker's log
// ("Download worker finished %s download"); stored minus one.
enum DownloadType {
  STATUS_UNSPECIFIED = 0;
  FULL_PACKAGE_DOWNLOADED = 1;
  PARTIAL_PACKAGE_UPDATED = 2;
  PARTIAL_UPDATE_EMPTY = 3;
}

// PersephoneDownloadWorker.verifyBinaryTransparency(): the package's inclusion
// proof against the signed transparency-log root.
message BinaryTransparencyCheck {  // qda / ost
  bool verified = 1;  // false when the check failed or the response had no proof
  BinaryTransparencyError error = 3;  // set when the check failed
}

// DefaultBinaryTransparencyVerifier's error code (cexf.a) minus one.
enum BinaryTransparencyError {
  BT_ERROR_0 = 0;  // not produced by this verifier
  BT_ERROR_1 = 1;  // not produced by this verifier
  LOG_ROOT_SIGNATURE_INVALID = 2;  // "Failure verifying log root signature." (also for a PrivateHashSet component)
  BT_ERROR_3 = 3;  // not produced by this verifier
  INCLUSION_PROOF_INCORRECT = 4;  // "Inclusion proof is incorrect."
  PROTECTION_HASH_EMPTY = 5;  // the package hash is SHA-256(0x00), the hash of an empty leaf; estimated name (medium)
  PROOF_MISSING = 6;  // the signature check failed and the protection proof is the empty default; estimated name (medium)
  INVALID_LOG_ROOT_ENVELOPE = 7;  // "Invalid log root envelope."
  PRIVATE_HASH_SET_PROOF_FAILED = 8;  // a PrivateHashSet component's proof is missing or wrong; estimated name (medium)
}

// GMS LogEvent sub-messages, as in client_logging_named.proto.

// The experiment IDs in force for the event (twn.b(), tzb.a()). Field names as in the open-source
// Firebase Clearcut transport's ExperimentIds (clearBlob, encryptedBlob).
message ExperimentIds {  // cfke
  ExperimentIdList clear_blob = 1;  // wire type bytes: the IDs from the app's ExperimentTokens plus the event's own
  repeated bytes encrypted_blob = 2;  // the ExperimentTokens' opaque experiment tokens
  bool has_experiment_tokens = 3;  // set whenever ExperimentTokens were supplied; estimated name (medium)
}

message ExperimentIdList {  // cfka
  repeated int32 experiment_id = 3 [features.repeated_field_encoding = EXPANDED];
}

// The active network when the event was uploaded (twf: ConnectivityManager.getActiveNetworkInfo()).
message NetworkConnectionInfo {  // crav
  ActiveNetworkType network_type = 1;  // NetworkInfo.getType()
  MobileSubtype mobile_subtype = 2;  // NetworkInfo.getSubtype(): TelephonyManager.NETWORK_TYPE_*
}

enum ActiveNetworkType {  // R8-unboxed enum crau; values are ConnectivityManager.TYPE_*
  MOBILE = 0;
  TYPE_NONE = -1;
  WIFI = 1;
  MOBILE_MMS = 2;
  MOBILE_SUPL = 3;
  MOBILE_DUN = 4;
  MOBILE_HIPRI = 5;
  WIMAX = 6;
  BLUETOOTH = 7;
  DUMMY = 8;
  ETHERNET = 9;
  MOBILE_FOTA = 10;
  MOBILE_IMS = 11;
  MOBILE_CBS = 12;
  WIFI_P2P = 13;
  MOBILE_IA = 14;
  MOBILE_EMERGENCY = 15;
  PROXY = 16;
  VPN = 17;
}

enum MobileSubtype {  // R8-unboxed enum cras; values are TelephonyManager.NETWORK_TYPE_*
  UNKNOWN_MOBILE_SUBTYPE = 0;
  GPRS = 1;
  EDGE = 2;
  UMTS = 3;
  CDMA = 4;
  EVDO_0 = 5;
  EVDO_A = 6;
  RTT = 7;
  HSDPA = 8;
  HSUPA = 9;
  HSPA = 10;
  IDEN = 11;
  EVDO_B = 12;
  LTE = 13;
  EHRPD = 14;
  HSPAP = 15;
  GSM = 16;
  TD_SCDMA = 17;
  IWLAN = 18;
  LTE_CA = 19;
  NR = 20;
  COMBINED = 100;  // getSubtype() returned -1
}

enum crah_a {  // R8-unboxed enum crah.a() (values only)
  CRAH_A_0 = 0;
  CRAH_A_1 = 1;
  CRAH_A_2 = 2;
}

message craj {
  string f1 = 1;
  string f2 = 2;
}
