edition = "2023";

// The Clearcut log sources of the Google app (com.google.android.googlequicksearchbox),
// decoded with the protobuf-lite schemas of its 15.5.58.29.arm64 APK (Pixel 8 factory image
// shiba-ap2a.240905.003). The app's TNG loggers send one AgsaClientLog per event; the log
// source is chosen by the product that logs (hbjf.a()). Generated by
// ../addon decoding/claude agsa/tools/build_agsa_proto.py: field numbers, types, presence
// and packing are the APK's; names come from the code that sets each field (class names in
// comments); "estimated name" marks names that the code does not settle. Unnamed messages
// keep their obfuscated class name, unnamed fields are f<number>.
// The outer LogEvent is as in client_logging_named.proto, with field 6 typed as the
// AgsaClientLog, field 11 as the GSA event code and field 18 as the visual-element event.

option features.utf8_validation = NONE;

message AgsaApa_LogEntry {  // crai; log source AGSA_APA
  int64 currentTimeMillis = 1;
  string packageName = 2;
  repeated craj keyValuePairList = 3;
  AgsaClientLog agsa_client_log = 6;  // wire type bytes
  GsaEventType eventId = 11;  // wire type int32: the GSA event code (Java enum ikmt)
  int64 eventFlowId = 12;
  sint64 timeZoneOffset = 15;
  ExperimentIds experiment_ids = 16;
  int64 elapsedRealtime = 17;
  VisualElementEvent veProducerByteString = 18;  // wire type bytes: the visual-element event (ijeg) the app attaches (elsi.b())
  crah_a f19 = 19;
  repeated int32 f20 = 20 [features.repeated_field_encoding = EXPANDED];
  int64 bootCount = 22;
  NetworkConnectionInfo network_connection_info = 23;
  bool notDirectBootMode = 25;
  double applied_sampling_rate = 30;  // only sent when flag ClearcutLogOperation__applied_sampling_rate is on; 1 = not sampled
}

