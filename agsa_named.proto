// GMS LogEvent sub-messages, as in client_logging_named.proto.

message craj {
  string f1 = 1;
  string f2 = 2;
}

// The experiment IDs in force for the event (twn.b(), tzb.a()). Field names as in the open-source
// Firebase Clearcut transport's ExperimentIds (clearBlob, encryptedBlob).
message ExperimentIds {  // cfke
  ExperimentIdList clear_blob = 1;  // wire type bytes: the IDs from the app's ExperimentTokens plus the event's own
  repeated bytes encrypted_blob = 2;  // the ExperimentTokens' opaque experiment tokens
  bool has_experiment_tokens = 3;  // set whenever ExperimentTokens were supplied; estimated name (medium)
}

message ExperimentIdList {  // cfka
  repeated int32 experiment_id = 3 [features.repeated_field_encoding = EXPANDED];
}

// The active network when the event was uploaded (twf: ConnectivityManager.getActiveNetworkInfo()).
message NetworkConnectionInfo {  // crav
  ActiveNetworkType network_type = 1;  // NetworkInfo.getType()
  MobileSubtype mobile_subtype = 2;  // NetworkInfo.getSubtype(): TelephonyManager.NETWORK_TYPE_*
}

enum ActiveNetworkType {  // R8-unboxed enum crau; values are ConnectivityManager.TYPE_*
  MOBILE = 0;
  TYPE_NONE = -1;
  WIFI = 1;
  MOBILE_MMS = 2;
  MOBILE_SUPL = 3;
  MOBILE_DUN = 4;
  MOBILE_HIPRI = 5;
  WIMAX = 6;
  BLUETOOTH = 7;
  DUMMY = 8;
  ETHERNET = 9;
  MOBILE_FOTA = 10;
  MOBILE_IMS = 11;
  MOBILE_CBS = 12;
  WIFI_P2P = 13;
  MOBILE_IA = 14;
  MOBILE_EMERGENCY = 15;
  PROXY = 16;
  VPN = 17;
}

enum MobileSubtype {  // R8-unboxed enum cras; values are TelephonyManager.NETWORK_TYPE_*
  UNKNOWN_MOBILE_SUBTYPE = 0;
  GPRS = 1;
  EDGE = 2;
  UMTS = 3;
  CDMA = 4;
  EVDO_0 = 5;
  EVDO_A = 6;
  RTT = 7;
  HSDPA = 8;
  HSUPA = 9;
  HSPA = 10;
  IDEN = 11;
  EVDO_B = 12;
  LTE = 13;
  EHRPD = 14;
  HSPAP = 15;
  GSM = 16;
  TD_SCDMA = 17;
  IWLAN = 18;
  LTE_CA = 19;
  NR = 20;
  COMBINED = 100;  // getSubtype() returned -1
}

enum crah_a {  // R8-unboxed enum crah.a() (values only)
  CRAH_A_0 = 0;
  CRAH_A_1 = 1;
  CRAH_A_2 = 2;
}

// The GSA client log and what it reaches.
message AgsaClientLog {  // jios
  string nid_cookie = 6;  // the Google NID cookie, "NID=<value>", from the app's cookie jar (gesk.c(), gesk.m()); sent when the logger has a cookie source (hbmh.a)
  ClientEvent client_event = 7;
  string f8 = 8;  // hbnv.a(); null in this build's hbnv (hbmh)
  string app_version = 10;  // the app's version name (hbmh.b())
  repeated fixed32 server_experiment_ids = 13 [features.repeated_field_encoding = EXPANDED];  // hbnv.c(); empty in this build's hbnv (hbmh)
  TapasQueryLog tapas_query_log = 16;  // ffkz from bpjc ('Tapas/TapasQueryLogger'), hbmr and adhg. estimated name (medium)
  izwf zero_state_cache_metadata = 17;  // izwf from avjs.d (ycb); its entries are built in bnpc.#mergeZeroStateResponses for stale CachedElementCandidates. estimated name (low)
  OnDeviceQueryLog on_device_query_log = 18;  // hvkz built in bzbd ('OnDeviceQueryLoggerImpl'); hbmq adds the jaty ContextLoggingMetadata as hvkz.5. estimated name (medium)
  RobinPolicyState robin_policy_state = 19;  // ikia built by cvla ("Ma-Robin-Policy", hbnp extras provider) only for log sources AGSA_ASSISTANT and AGSA_APA (cvla.java:11), set as jios.j by hchq.java:94-108. estimated name (medium)
}

message VisualElementEvent {  // ijeg
  VeEventId event_id = 1;  // id of this event: the client's EI plus a counter (fvlh)
  repeated VisualElement visual_element = 2;  // the visual elements shown (impression events: "Impressions must be in their own event.")
  VeEventId parent_event_id = 3;  // the event the elements were attached to (fvsc.b); estimated name (medium)
  VeEventRootInfo root = 4;  // root information, from fvsc.a (fvqz.b); estimated name (low)
  VeInteractionType interaction_type = 5;  // estimated name (medium): Enum_ijgi (VeInteractionType): 3 on user interactions, fvli.g() 1/2 on show/hide
  VeInteractions interactions = 7;  // taps and other interactions with elements
  VeEventId f8 = 8;
  VeEventLink linked_event = 9;
}

