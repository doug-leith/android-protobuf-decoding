  int64 time_ms = 2;
  bool f4 = 4;
}

message PreKey {  // not in the APK: the shape of the captured field (Play services 26.31.31's copy where noted)
  int32 id = 1;
  bytes key = 2;
}

message RegisteredDevice {  // not in the APK: the shape of the captured field (Play services 26.31.31's copy where noted)
  bytes registration_id = 1;
  repeated int32 capabilities = 2;
  PublicKey public_key = 3;
  int32 f4 = 4;
  string language_tag = 5;
  uint64 f7 = 7;
}

message RegistrationStatus {  // not in the APK: the shape of the captured field (Play services 26.31.31's copy where noted)
  int32 f1 = 1;
  RegistrationStatusDetail f2 = 2;
  int32 f3 = 3;
}

message RegistrationStatusDetail {  // not in the APK: the shape of the captured field (Play services 26.31.31's copy where noted)
  string f1 = 1;
  string f2 = 2;
}

message SignedPreKey {  // not in the APK: the shape of the captured field (Play services 26.31.31's copy where noted)
  int32 id = 1;
  bytes key = 2;
  bytes signature = 3;
}

