edition = "2023";

// The CARRIER_SERVICES Clearcut log source: telemetry of the RCS (chat) and
// carrier-messaging stack built into Google Messages
// (com.google.android.apps.messaging; the RCS engine came from the Carrier
// Services app, com.google.android.ims). Each event names the Messages build
// and the SIM's carrier (MCC/MNC, name, carrier id) and carries one event:
// RCS provisioning and registration state, RCS availability ("Jibe" service)
// changes, SIP and message delivery outcomes, DroidGuard token creation, ...
//
// Schema from the Messages APK messages.android_20240130_01_RC02 in the
// Pixel 8 factory image shiba-ap2a.240905.003 (/product/priv-app/PrebuiltBugle),
// checked against messages.android_20240903_01_RC02 (shiba-ap4a.250205.002).
// Generated by ../addon decoding/claude carrier_services/tools/build_proto.py:
// field numbers, types, presence and packing are the APK's; names come from
// the code that sets each field (obfuscated class names of the January build
// in comments); "estimated name" marks names that the code does not settle.
// Unnamed messages keep their class name, unnamed fields are f<number>.
// The outer LogEvent is as in client_logging_named.proto, with field 6 typed
// as the CarrierServicesLog and field 11 as its event type.

option features.utf8_validation = NONE;

message CarrierServices_LogEntry {  // crai (GMS)
  int64 currentTimeMillis = 1;
  string packageName = 2;
  repeated craj keyValuePairList = 3;
  CarrierServicesLog carrier_services_log = 6;  // wire type bytes
  EventType eventId = 11;  // wire type int32: the event's type, as in carrier_services_log.event_type
  int64 eventFlowId = 12;
  sint64 timeZoneOffset = 15;
  ExperimentIds experiment_ids = 16;
  int64 elapsedRealtime = 17;
  bytes veProducerByteString = 18;
  crah_a f19 = 19;
  repeated int32 f20 = 20 [features.repeated_field_encoding = EXPANDED];
  int64 bootCount = 22;
  NetworkConnectionInfo network_connection_info = 23;
  bool notDirectBootMode = 25;
  double applied_sampling_rate = 30;  // only sent when flag ClearcutLogOperation__applied_sampling_rate is on; 1 = not sampled
}

// GMS LogEvent sub-messages, as in client_logging_named.proto.

message craj {
  string f1 = 1;
  string f2 = 2;
}

// The experiment IDs in force for the event (twn.b(), tzb.a()). Field names as in the open-source
// Firebase Clearcut transport's ExperimentIds (clearBlob, encryptedBlob).
message ExperimentIds {  // cfke
  ExperimentIdList clear_blob = 1;  // wire type bytes: the IDs from the app's ExperimentTokens plus the event's own
  repeated bytes encrypted_blob = 2;  // the ExperimentTokens' opaque experiment tokens
  bool has_experiment_tokens = 3;  // set whenever ExperimentTokens were supplied; estimated name (medium)
}

message ExperimentIdList {  // cfka
  repeated int32 experiment_id = 3 [features.repeated_field_encoding = EXPANDED];
}

// The active network when the event was uploaded (twf: ConnectivityManager.getActiveNetworkInfo()).
message NetworkConnectionInfo {  // crav
  ActiveNetworkType network_type = 1;  // NetworkInfo.getType()
  MobileSubtype mobile_subtype = 2;  // NetworkInfo.getSubtype(): TelephonyManager.NETWORK_TYPE_*
}

enum ActiveNetworkType {  // R8-unboxed enum crau; values are ConnectivityManager.TYPE_*
  MOBILE = 0;
  TYPE_NONE = -1;
  WIFI = 1;
  MOBILE_MMS = 2;
  MOBILE_SUPL = 3;
  MOBILE_DUN = 4;
  MOBILE_HIPRI = 5;
  WIMAX = 6;
  BLUETOOTH = 7;
  DUMMY = 8;
  ETHERNET = 9;
  MOBILE_FOTA = 10;
  MOBILE_IMS = 11;
  MOBILE_CBS = 12;
  WIFI_P2P = 13;
  MOBILE_IA = 14;
  MOBILE_EMERGENCY = 15;
  PROXY = 16;
  VPN = 17;
}

enum MobileSubtype {  // R8-unboxed enum cras; values are TelephonyManager.NETWORK_TYPE_*
  UNKNOWN_MOBILE_SUBTYPE = 0;
  GPRS = 1;
  EDGE = 2;
  UMTS = 3;
  CDMA = 4;
  EVDO_0 = 5;
  EVDO_A = 6;
  RTT = 7;
  HSDPA = 8;
  HSUPA = 9;
  HSPA = 10;
  IDEN = 11;
  EVDO_B = 12;
  LTE = 13;
  EHRPD = 14;
  HSPAP = 15;
  GSM = 16;
  TD_SCDMA = 17;
  IWLAN = 18;
  LTE_CA = 19;
  NR = 20;
  COMBINED = 100;  // getSubtype() returned -1
}

enum crah_a {  // R8-unboxed enum crah.a() (values only)
  CRAH_A_0 = 0;
  CRAH_A_1 = 1;
  CRAH_A_2 = 2;
}

// The carrier-services event and what it reaches.
message CarrierServicesLog {  // dicg; built by ccef.C() (log text "Unable to create CarrierServices clearcut event") and ccej.c(); one event per LogEvent, in the oneof. Message name estimated (high)
  AppInfo carrier_services_app = 2;  // the PackageInfo of Carrier Services (com.google.android.ims) when that app logs, or of Google Fi (com.google.android.apps.tycho); empty when Messages logs (ccej.c()). estimated name (medium)
  AppInfo messages_app = 3;  // the PackageInfo of Google Messages (com.google.android.apps.messaging), ccej.c()
  ImsConfiguration ims_configuration = 24;  // ccef.C(): the RCS config server URL and the ImsConfiguration of the current IMS registration
  EventSource event_source = 26;  // the logger's event source (ccef constructor argument)
  HostApp host_app = 27;  // which app logged (ccej.c(): Messages, Carrier Services, or Google Fi). estimated name (medium)
  string tachyon_anonymous_device_id = 30;  // PRIVACY: a persistent pseudonymous device id. The id Google's Tachyon server returns to Messages' anonymous Tachyon registration (belq "AnonymousRegistrationProvider": "Received Tachyon registration"), sent to the RCS engine by intent rcs.intent.action.tachyonAnonymousDeviceId (bhjb.c(): "Send Tachyon Anonymous Device ID to RCS process") and stored in pref tachyon_anonymous_device_id (ceog.i, celi.java:92); the same value on every event until re-registration. In the captures it is +<country code>-<27 characters>
  string testing_simulation_session_id = 35;  // flag bugle_testing_simulation_session_id (ccio.j), empty outside tests. estimated name (high)
  LogLossInfo log_loss_info = 40;  // estimated name (medium): ccej.b() adds it to every Nth event when flag enable_sample_logging is on (N = flag log_sample_size); Bugle's own logger fills the same message from flags log_loss_max_session_id_hash / log_loss_max_unsigned_sequence_number (afep.java). Not in the captures.
  oneof oneof0 {
    SimOperator sim_operator = 6;
    dqrv no_sim = 7;
    dqsb no_phone_permission = 8;
  }
  oneof oneof1 {
    dqsx registration_event = 9;
    dqpj call_event = 10;
    SipMessageEvent sip_event = 11;
    dqri media_event = 12;
    ProvisioningReport provisioning_event = 13;
    ImsStateEvent ims_state_event = 14;
    dqpq f15 = 15;
    dqrt network_status_change_event = 16;
    dqtd session_event = 17;
    RcsExtensionEvent rcs_extension_event = 18;
    drey socket_event = 20;
    dqpf ads_event = 21;
    TelephonyEvent telephony_event = 22;
    dqtb self_service_message_event = 23;
    DiagnosticEvent diagnostic_event = 25;
    dqqh f28 = 28;
    dqph anomaly_event = 29;
    dqsz registration_switch_event = 31;
    ContentProviderRequestEvent content_provider_request_event = 32;
    ImsServiceSessionEvent ims_service_session_event = 33;
    RcsProvisioningDetails rcs_provisioning_details = 36;
    FileTransferEvent file_transfer_event = 37;
    JibeServiceEvent jibe_service_event = 38;
    XslRequestEvent xsl_request_event = 39;
  }
}

message AppInfo {  // dica; ccej.f(package): the PackageInfo of an app (log text "%s client info: %s"). Message name estimated (high)
  int32 version_code = 1;  // PackageInfo.versionCode
  string version_name = 2;  // PackageInfo.versionName
}

message SimOperator {  // dqrx; ccef.C(), from the RCS engine's stored SIM info (cels; log text "Unable to retrieve SIM operator information for metrics!"). Message name estimated (high)
  string mcc = 1;  // the first 3 digits of pref sim_operator (TelephonyManager SIM operator MCC+MNC)
  string mnc = 2;  // pref sim_operator after the first 3 digits
  string sim_operator_name = 3;  // pref sim_operator_name (the SIM's service provider name)
  string group_id_level1 = 4;  // pref group_id_level1 (TelephonyManager.getGroupIdLevel1(), the SIM's GID1 carrier group id)
  bool is_fi_device = 5;  // pref is_fi_device (a Google Fi SIM)
}

message dqrv {
}

message dqsb {
}

message dqsx {
}

message dqpj {
}

message SipMessageEvent {  // dqwt; one SIP message sent or received by the RCS engine's SIP stack (ccjd.java:310-600, logged as drdq.SIP_EVENT); also used directly by another dicg case. Name from drdq.SIP_EVENT: estimated name (medium)
  fixed64 timestamp_micros = 1;  // wall-clock time in microseconds: TimeUnit.MILLISECONDS.toMicros(Calendar.getInstance().getTimeInMillis()) (ccjd.java:363-367). estimated name (high)
  SipMessageDirection direction = 2;  // 0 = message sent (cycj.d, the send path), 1 = message received (cycg receive path); ccja.c(..., i, ...) stores i-1. estimated name (medium)
  SipMessageType message_type = 3;  // 1 = SIP request (cyhh), 2 = SIP response (cyhi) (ccjd.java:445-460). estimated name (high)
  SipMethod method = 4;  // SIP method of the request (or of the CSeq of the response), cerb.E(): INVITE, ACK, ... UPDATE (ccjd.java:368-373). estimated name (high)
  int32 status_code = 5;  // SIP response status code, cyhi.y() (responses only). estimated name (high)
  int32 cseq = 6;  // CSeq sequence number, cyhg.a() reads the 'CSeq' header (cyed). estimated name (high)
  string call_id = 7;  // SIP Call-ID header value (cyhg.d() -> cyfs.h() reads the 'Call-Id' header cyee). PRIVACY: dialog identifier, random per SIP dialog; links the SIP events of one conversation/session. estimated name (high)
  string google_event_id = 8;  // value of the 'X-Google-Event-Id' SIP header (ccjd.java:510-516); server-assigned event id. estimated name (high)
  SipTransportDirection transport_direction = 9;  // 3 on the send path (ccja.c(..., 4, ...)), 4 on the receive path (..., 5, ...): a second direction/stage code; estimated name (low)
  TransportEndpoint transport = 10;  // transport the message went over (SIP server address, port, TLS host name, protocol)
  string reason_header = 12;  // value of the SIP 'Reason' header (ccjd.java:518-527). estimated name (high)
  int32 contact_expires = 13;  // 'expires' parameter of the Contact header, only for REGISTER and PUBLISH (ccjd.java:528-546, cyeh.e() = i("expires")). estimated name (high)
  string reason_phrase = 16;  // SIP response reason phrase, cyhi.A() (responses only). estimated name (high)
  string imdn_message_id = 17;  // IMDN Message-ID (urn:ietf:params:imdn) from the message/cpim body, or from the matching request for a response (ccjd.java:16-29, 391-416). PRIVACY: RCS message id, identifies the chat message. estimated name (high)
  SipErrorResponseInfo error_response_info = 18;  // only for responses the engine generated itself with a reason (flag bug_191166396)
  int32 retry_after = 21;  // SIP 'Retry-After' header as an integer (cyhf.a). estimated name (high)
  repeated RcsCapability contact_capabilities = 22;  // capabilities found in the Contact header; only '+g.gsma.rcs.isbot' -> RCS_RBM_BOT_CAPABILITY is mapped (ccjd.java:10, 417-436). estimated name (medium)
  PreferredService preferred_service = 23;  // P-Preferred-Service header mapped to dqws (CPM session / pager / large message), flag enable_logging_preferred_service (ccjd.java:586-595). estimated name (high)
}

message dqri {
}

message ProvisioningReport {  // dqsh; RCS provisioning state report: estimated name (high), sent by PeriodicMetricsJobService with EventType PROVISIONING_EVENT ('Unable to send provisioning event log'); the DroidGuard logger cdqj sends it with only fields 1 and 16.
  string provisioning_session_id = 1;  // cdqj.java:34: the provisioning session id passed with the DroidGuard request ('unknown' if absent): a random UUID made per provisioning session (cdtm.java:1417, pref provisioning_engine_provisioning_session_id_key), also sent to the provisioning server as PROVISIONING_SESSION_ID in the DroidGuard content binding (cdqo.java). PRIVACY: identifier linking this log to the RCS provisioning requests. estimated name (high)
  RcsProvisioningState provisioning_state = 6;  // PeriodicMetricsJobService.java:414: the provisioning engine's state (pref provisioning_engine_state_key) mapped to RCS_PROVISIONING_*_STATE. estimated name (high)
  ProvisioningEventTrigger trigger = 7;  // PeriodicMetricsJobService.java:420: constant 3 from the periodic metrics job; no other writer in either build. estimated name (low)
  RcsFlagState rcs_flag_state = 9;  // PeriodicMetricsJobService.java:78/85: 1 when the Phenotype flag PhenotypeRcsFlags__enabled is true, else 2. estimated name (medium)
  RcsAvailability rcs_availability = 10;  // PeriodicMetricsJobService.java:99: the stored RCS availability (djjv: AVAILABLE, DISABLED_VIA_GSERVICES, DISABLED_NOT_DEFAULT_SMS_APP, ...) for the current SIM id. estimated name (medium)
  DroidGuardTokenCreation droidguard_token_creation = 16;  // cdqj.java:40: result of creating the DroidGuard token for the RCS provisioning request ('Could not create DroidGuard token creation event'). estimated name (medium)
}

message ImsStateEvent {  // dqqo; IMS state event: estimated name (medium); captured case-14 events carry eventId IMSSTATE_EVENT(9). In this build cdmv.p() builds it and does not log it.
  ImsRegistrationState registration_state = 15;  // cdmv.java:32: 2-1 when the SIP registration completes (cdgg.j 'REGISTERED'), 3-1 from cdgg.l()/m(). estimated name (low)
}

message dqpq {
