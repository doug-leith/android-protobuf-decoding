message ContentProviderRequestEvent {  // dqpo; One ContentResolver.call() from the RCS engine to the Messages preferences ContentProvider (ceoj.f()): estimated name (high), log 'Unable to send ContentProvider request event log'. Sent on failure, and on success when a flag is on.
  ContentProviderRequestResult result = 1;  // ceoj.java:66/73: 1 when the call returned no result_error_key, else 2. estimated name (medium)
  ContentProviderFailureReason failure_reason = 2;  // ceoj.java:79: result_error_key from the provider's reply via dqpm.a(), minus 1; names from the switch in ceoj.f() (FAILURE_REASON_UNKNOWN ... PREFERENCE_KEY_NOT_SUPPORTED_ERROR). estimated name (high)
  string provider_package_name = 3;  // ceoj.java:60: constant 'com.google.android.apps.messaging'. estimated name (medium)
  string caller_package_name = 4;  // ceoj.java:54: Context.getPackageName() of the calling app. estimated name (medium)
  string storage_file_name = 5;  // ceoj.java:34: Bundle extra 'storage_file_name' (preferences file, e.g. 'bugle').
  string preference_key = 6;  // ceoj.java:40: Bundle extra 'preference_key' (the preference read or written).
  string exception = 7;  // ceoj.java:89: the exception text via ceqf.GENERIC.c() (redacted to 'chars:N' unless a debug flag is on); only when the log-level flag is VERBOSE. estimated name (medium)
  string method = 8;  // ceoj.java:46: the ContentResolver.call method ('GET'/'PUT'). estimated name (medium)
}

message ImsServiceSessionEvent {  // dqqm; End or rejection of an RCS/IMS SIP session (ccjd.a/b, sent by ccfj.d with EventType IMS_SERVICE_SESSION_EVENT). estimated name (high)
  string session_id = 1;  // ccjd.java:52/338: the session's SIP Call-ID (ceif/cenj pass cyhh.d(), 'Call ID is null.'). Every caller passes the same string for 1 and 2. PRIVACY: per-SIP-session identifier. estimated name (low)
  string call_id = 2;  // ccjd.java:58/332: same value as session_id (SIP Call-ID). estimated name (low)
  SessionDirection session_direction = 3;  // ccjd.java:319: 2 when the session was created without an incoming SIP request (cecl.p = request == null, i.e. locally originated), else 1. estimated name (medium)
  SessionStopReason stop_reason = 9;  // ccjd.java:94: session stop reason (cecl.aa logs 'Stop reason: %d subreason: %d'); 2 for a rejected invitation (cecl.Y/Z). estimated name (high)
  SessionStopSubreason stop_subreason = 10;  // ccjd.java:312: stop sub-reason (1..71). estimated name (high)
  RecipientVerifyMethod recipient_verify_method = 19;  // ccjd.java:343: how the incoming request's destination was matched to this device; logged only when flag log_recipient_verify_method is on (cenj.java). estimated name (high)
}

message RcsProvisioningDetails {  // drca; Snapshots of the RCS provisioning engine (cdzv.a, EventType RCS_PROVISIONING_DETAILS, 'provisioning snapshots log'). estimated name (high)
  ProvisioningAttempt first_provisioning_snapshot = 1;  // cdzv.java:61: drcx.b, which cdzf.java:461 fills only while pref provisioning_engine_has_provisioned_once_key_v2 is false (device never provisioned) and a counter is < 8. estimated name (medium)
  ProvisioningAttempt provisioning_snapshot = 2;  // cdzv.java:83: the current provisioning snapshot (drcx.c) with the latest provisioning stage events and drcx.e appended. estimated name (medium)
}

message FileTransferEvent {  // dqxu; HTTP file transfer progress/result (cceq/ccep, EventType FILE_TRANSFER_EVENT). estimated name (high)
  FileTransferType transfer_type = 1;  // cceq.java:25: ccep type - 1: 1 download (ccmk FileDownloadRunnable), 3 upload (ccmx), 4 resumed upload (cclm 'HTTP FT resume pending'), 5 thumbnail download (ccph). estimated name (medium)
  HttpEvent http_event = 2;  // ccep.java:73/128/175: HTTP request/response details (dqya: response code + latency, headers, or I/O error). estimated name (medium)
  AuthenticationType authentication_type = 3;  // cceq.java:46: dqxo AUTHENTICATION_TYPE_* of the transfer. estimated name (high)
  FileTransferStatus status = 4;  // cceq.java:86: ccep.c(i)/a() status - 1: 1,2 at start, 3 retry-after, 4 failed, 5 completed. estimated name (medium)
  FileTransferFailureReason failure_reason = 5;  // cceq.java:99: dqxs FILE_TRANSFER_FAILURE_REASON_*. estimated name (high)
  string file_id = 6;  // cceq.java:33: the HTTP file transfer's file id (cclm passes pendingTransferInfo.mFileId). PRIVACY: per-file-transfer identifier. estimated name (medium)
}

message JibeServiceEvent {  // dqre; Failure of a bind to the RCS JibeService (JibeService.onBind), EventType JIBE_SERVICE_EVENT. estimated name (high)
  oneof oneof0 {
    JibeServiceBindFailure bind_failure_reason = 1;
  }
}

message XslRequestEvent {  // dynu; Cross-stack (XSL) message trace point: one RCS message passing a node (ccfo, EventType XSL_REQUEST_EVENT; also written by Bugle loggers bgcs/aqqy/blhw/bkir/ampa). estimated name (high)
  TraceId trace_id = 1;  // ccfo.java:64: the message's TraceId (com.google.android.rcs.client.messaging.data.TraceId, cdbl.java); Bugle makes it with UUID.randomUUID() (bnwb.java). Used to sample (UUID hash vs rate). PRIVACY: random per-message trace id, shared with the server-side XSL nodes. estimated name (high)
  XslRequestIds ids = 2;  // ccfo.java:35: message ids / tickle ids of the traced request (dyno). estimated name (medium)
  int32 request_state = 3 [features.field_presence = IMPLICIT];  // open enum: class not recorded ccfo.java:45: Java enum dynt XSL_REQUEST_STATE_* (e.g. REQUEST_PROCESSED, REQUEST_DROPPED). estimated name (high)
  int32 node = 4 [features.field_presence = IMPLICIT];  // open enum: class not recorded ccfo.java:41: Java enum eavp XSL_NODE_* (XSL_NODE_RCS_ENGINE here). estimated name (high)
  Timestamp timestamp = 7;  // ccfo.java:56: System.currentTimeMillis() as a Timestamp. estimated name (high)
  XslNodeStatus node_status = 10;  // aqqy.java:74 / bfqp.java:431: Bugle sending status or message origin (dynr). estimated name (low)
  int32 inside_node = 11 [features.field_presence = IMPLICIT];  // open enum: class not recorded ccfo.java:49: Java enum dyns (INSIDE_NODE_UNSPECIFIED, RCS_ENGINE_SMAPI_SEND_MESSAGE, ...): the component inside the node. estimated name (high)
}

message LogLossInfo {  // dqrg; Log-loss tracking metadata (session id + sequence number) attached to sampled events. estimated name (medium)
  string session_id = 1;  // ccej.java:139: UUID.randomUUID() made once per ccej logger instance. PRIVACY: random id linking all sampled events from one logger lifetime. estimated name (medium)
  int64 sequence_number = 2;  // ccej.java:146: per-logger counter incremented for each sampled event. estimated name (medium)
  uint64 session_id_hash = 3;  // afdu.java:209 (Bugle's own Clearcut logger): random UUID bits modulo flag log_loss_max_session_id_hash. estimated name (high)
  uint64 unsigned_sequence_number = 4;  // afdu.java:216: event counter modulo flag log_loss_max_unsigned_sequence_number. estimated name (high)
}

