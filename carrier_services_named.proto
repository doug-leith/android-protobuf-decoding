message ImsConfiguration {  // dqqj; ccef.C(), from the RCS engine's ImsConfiguration (cdos.toString() "ImmutableImsConfiguration{...}") and config server (cdzm). Message name estimated (high)
  string config_server_url = 1;  // the RCS auto-configuration server URL (cdzm.c(): log text "Using config server URL from %s" / "Using MCC based URL"). estimated name (high)
  string pcscf_address = 2;  // ImsConfiguration pcscfAddress (cdos.toString())
  uint32 pcscf_port = 3;  // ImsConfiguration pcscfPort (cdos.toString())
  string domain = 4;  // ImsConfiguration domain (cdos.toString())
  bool rcs_volte_single_registration = 5;  // ImsConfiguration rcsVolteSingleRegistration (cdos.toString())
}

message DiagnosticEvent {  // drau; dicg event case 25. Built by ccfb.x() and sent by ccfb.u() with event type drdq.DIAGNOSTIC_EVENT (ccfb.java:52). Subclasses: ccff/ccfe/ccfa/ccex (field 3), ccfh (4, 5), ccel (6), ccfl (8), ccfn (10), ccfk (12).
  string process_session_id = 1;  // estimated name (medium): ccfb.java:10 sets it from the static ccfb.d = UUID.randomUUID().toString(), created once when the class loads. PRIVACY: random UUID per app process lifetime; links every diagnostic event of one process run (also copied into ProvisioningAttemptInfo.process_session_id).
  int32 sequence_number = 2;  // estimated name (medium): ccfb.java:28 sets it from the static AtomicInteger ccfb.e.incrementAndGet(); counter of diagnostic events since the process started.
  string provisioning_session_id = 7;  // estimated name (high): ccfb.w() is given cdtm.m, the UUID that cdtm.ak() stores under pref key "provisioning_engine_provisioning_session_id_key" ("startNewProvisioningAttempt, provisioningSessionId=%s"); cdtu/cdpw pass cdzh.B(), the same key. PRIVACY: random UUID per provisioning attempt; created at startNewProvisioningAttempt (cdtm.java:1416), cleared at finishProvisioningAttempt (cdtm.java:1521); also sent as session_id to the GMS consent/UPI APIs.
  oneof oneof0 {
    RcsDiagnostic rcs_diagnostic = 3;
    ProvisioningAttempt provisioning_attempt = 4;
    ProvisioningStageFinished provisioning_stage_finished = 5;
    RcsConfigurationInfo configuration_update = 6;
    RcsFlagsSnapshot rcs_flags_snapshot = 8;
    ProvisioningDataStorageError provisioning_data_storage_error = 10;
    bool f11 = 11;
    RcsFlagsComparison rcs_flags_comparison = 12;
  }
}

