message RcsExtensionEvent {  // drfc; case 18 of dicg's event oneof; built only through ccfj (the RCS engine's clearcut sender, kept field name 'rcsExtensionSender' in ChatSessionEngine.java; its error log reads 'Unable to send RCS extension log'). Each oneof case is sent with its own drdq event type (ccfj.java:28-83, ccjd.java:599-606, cckq.java:124-131, cdfn.java:413-428, cedv.java:34-41). estimated name (medium)
  RcsSelfServiceMessage self_service_message = 8;  // FCM self-service message; set by ccfj.g (ccfj.java:53-70) with drdq.SELF_SERVICE_MESSAGE_EVENT
  RcsConfigurationInfo rcs_configuration = 9;  // RCS provisioning configuration state (dqsf, named by group A): present?, version, validity, config state; set with every uptime event (cdfn.java:367-407). estimated name (medium)
  oneof oneof0 {
    drfa f1 = 1;
    SipMessageEvent sip_message = 2;
    dqwv f4 = 4;
    dqpv f5 = 5;
    RcsUptimeEvent rcs_uptime = 6;
