edition = "2023";

// The CLIENT_LOGGING_PROD Clearcut log source: warning and error log records
// (Flogger/java.util.logging) that Google apps built on the TikTok framework
// upload through com.google.apps.tiktok.logging.backends.clientlogging.
// The log record schema is from the Google Messages APK (Pixel 2, 2021;
// obfuscated class names in comments), the outer LogEvent from GMS 21.48.15
// (as in icing_named.proto). Names are from the code that sets each field;
// "estimated name" marks names that the code does not settle.

option features.utf8_validation = NONE;

message ClientLogging_LogEntry {  // crai (GMS)
  int64 currentTimeMillis = 1;
  string packageName = 2;
  repeated craj keyValuePairList = 3;
  ClientLog client_log = 6;  // wire type bytes
  int32 eventId = 11;
  int64 eventFlowId = 12;
  sint64 timeZoneOffset = 15;
  ExperimentIds experiment_ids = 16;
  int64 elapsedRealtime = 17;
  bytes veProducerByteString = 18;
  crah_a f19 = 19;
  repeated int32 f20 = 20 [features.repeated_field_encoding = EXPANDED];
  int64 bootCount = 22;
  NetworkConnectionInfo network_connection_info = 23;
  bool notDirectBootMode = 25;
  double applied_sampling_rate = 30;  // only sent when flag ClearcutLogOperation__applied_sampling_rate is on; 1 = not sampled
}

// One upload: a log record, or a count of how often a log site fired.
message ClientLog {  // bivv, built by bivc.d()
  ClientInfo client_info = 2;
  LogRecord log_record = 3;
  TraceSpans trace = 7;  // names of the TikTok trace spans active when logged
  repeated LoggedArgument logged_argument = 9;  // arguments marked safe to log
  LogType log_type = 12;
  int64 repeat_count = 13;  // with log_type REPEAT_COUNT: times the log site fired in the 1 h window
}

// Stored as the type number minus one (bivu.a() maps back).
enum LogType {  // R8-unboxed enum bivu
  LOG_TYPE_1 = 0;  // not sent by this build
  FIRST_OCCURRENCE = 1;  // the first record from a log site in the 1 h window (estimated name (high))
  REPEAT_COUNT = 2;  // sent when the window closes, with repeat_count (estimated name (high))
}

message ClientInfo {  // bivn
  AppInfo app_info = 2;
  bivy f6 = 6;
}

message AppInfo {  // bivr, set from bivc's constructor arguments
  int32 version_code = 2;  // estimated name (medium)
  string package_name = 4;
  string version_name = 5;
}

message bivy {
  bivx f6 = 6;  // always 0 in this build
}

enum bivx {  // inline verifier bivx (values only)
  BIVX_0 = 0;
  BIVX_1 = 1;
  BIVX_2 = 2;
  BIVX_3 = 3;
}

// A Flogger/java.util.logging record.
message LogRecord {  // bgct, built by bivc.c()
  EventId event_id = 1;  // always zeros here
  string thread_name = 2;
  int32 level = 3;  // java.util.logging.Level.intValue(): 800 INFO, 900 WARNING, 1000 SEVERE
  string class_name = 4;  // log site
  string method_name = 5;  // log site
  string message = 6;  // the log message or its format string; arguments are in logged_argument
  Throwables throwable = 8;
  int32 line_number = 13;  // log site
}

// Google's "EI" event ID (augw.a() decodes it from its base64 form).
message EventId {  // bgcr
  int64 time_usec = 1;
  fixed32 server_ip = 2;
  fixed32 process_id = 3;
}

// A Throwable and its getCause() chain (bgfm.a()).
message Throwables {  // bgcz
  ThrowableInfo throwable = 1;
  repeated ThrowableInfo cause = 2;
}

message ThrowableInfo {  // bgcx
  string class_name = 1;
  string message = 2;  // only when the caller asks for it; not by client logging
  int64 f3 = 3;
  repeated StackFrame stackframe = 4 [features.message_encoding = DELIMITED];  // group
}

message StackFrame {  // bgcw, from a StackTraceElement
  string class_name = 5;
  string method_name = 6;
  string file_name = 7;  // "PG" for obfuscated classes
  int32 line_number = 8;
}

message TraceSpans {  // bivp, from bcrx.q(): the current span and its parents
  repeated string span_name = 1;
}

message LoggedArgument {  // biwa
  uint32 argument_index = 1;
  string value = 2;  // toString() of the argument
}

// GMS LogEvent sub-messages, as in icing_named.proto.

// The experiment IDs in force for the event (twn.b(), tzb.a()). Field names as in the open-source
// Firebase Clearcut transport's ExperimentIds (clearBlob, encryptedBlob).
message ExperimentIds {  // cfke
  ExperimentIdList clear_blob = 1;  // wire type bytes: the IDs from the app's ExperimentTokens plus the event's own
  repeated bytes encrypted_blob = 2;  // the ExperimentTokens' opaque experiment tokens
  bool has_experiment_tokens = 3;  // set whenever ExperimentTokens were supplied; estimated name (medium)
}

message ExperimentIdList {  // cfka
  repeated int32 experiment_id = 3 [features.repeated_field_encoding = EXPANDED];
}

// The active network when the event was uploaded (twf: ConnectivityManager.getActiveNetworkInfo()).
message NetworkConnectionInfo {  // crav
  ActiveNetworkType network_type = 1;  // NetworkInfo.getType()
  MobileSubtype mobile_subtype = 2;  // NetworkInfo.getSubtype(): TelephonyManager.NETWORK_TYPE_*
}

enum ActiveNetworkType {  // R8-unboxed enum crau; values are ConnectivityManager.TYPE_*
  MOBILE = 0;
  TYPE_NONE = -1;
  WIFI = 1;
  MOBILE_MMS = 2;
  MOBILE_SUPL = 3;
  MOBILE_DUN = 4;
  MOBILE_HIPRI = 5;
  WIMAX = 6;
  BLUETOOTH = 7;
  DUMMY = 8;
  ETHERNET = 9;
  MOBILE_FOTA = 10;
  MOBILE_IMS = 11;
  MOBILE_CBS = 12;
  WIFI_P2P = 13;
  MOBILE_IA = 14;
  MOBILE_EMERGENCY = 15;
  PROXY = 16;
  VPN = 17;
}

enum MobileSubtype {  // R8-unboxed enum cras; values are TelephonyManager.NETWORK_TYPE_*
  UNKNOWN_MOBILE_SUBTYPE = 0;
  GPRS = 1;
  EDGE = 2;
  UMTS = 3;
  CDMA = 4;
  EVDO_0 = 5;
  EVDO_A = 6;
  RTT = 7;
  HSDPA = 8;
  HSUPA = 9;
  HSPA = 10;
  IDEN = 11;
  EVDO_B = 12;
  LTE = 13;
  EHRPD = 14;
  HSPAP = 15;
  GSM = 16;
  TD_SCDMA = 17;
  IWLAN = 18;
  LTE_CA = 19;
  NR = 20;
  COMBINED = 100;  // getSubtype() returned -1
}

enum crah_a {  // R8-unboxed enum crah.a() (values only)
  CRAH_A_0 = 0;
  CRAH_A_1 = 1;
  CRAH_A_2 = 2;
}

message craj {
  string f1 = 1;
  string f2 = 2;
}
