syntax = "proto2";

// CONSENT_INFO key of a Clearcut LogEvent (base64 of ConsentInformationWrapper), added by GMS's usage
// reporting client (UsageReportingClientImp) to each event of a log source that is uploaded only with
// the user's consent. Schema from GMS 21.48.15, 24.06.16 and 26.31.31; see
// "addon decoding/claude consent_info/README.md".

enum BoolVal {
	NotSet=0;  // not known, e.g. Play Pass opt-in could not be read
	False=1;
	True=2;
	Any=3;     // only in GMS's consent rules (match any value), never sent
}

message ConsentInformation {
optional BoolVal checkboxEnabled=1; // Usage & diagnostics setting on this device (OptInUsageReporting)
optional BoolVal checkboxGooglePlayServicesVersionValid=2; // opted in with GMS >= new_checkbox_gms_core_version_bound (11200000); False when opted out
optional BoolVal supplWebAndApp=3;  // account: Web & App Activity's "Include Chrome history and activity from sites, apps and devices that use Google services" (UDC setting 8, SUPPL_WEB_AND_APP)
optional BoolVal supplWebAndApp_DeviceLevel=4; // account, this device: the same, for activity from this device (UDC setting 10)
optional BoolVal deviceInfo=5;        // account: Device Information activity control (UDC setting 7); dropped between GMS 24.23 and 24.47
optional BoolVal deviceInfo_DeviceLevel=6; // account, this device: Device Information (UDC setting 9); dropped between GMS 24.23 and 24.47
optional BoolVal platform_mnop=7;  // Phenotype flag platform_mnop: Google dogfood (test) device, not a user setting
optional BoolVal optInPlayPass=8;  // account: Google Play Pass usage measurement opt-in; dropped between GMS 24.23 and 24.47
optional BoolVal checkboxFromSetupWizard=9;  // the Usage & diagnostics choice was last made in Setup Wizard (CbFromSetupWizard)
optional BoolVal multiUserCheckbox=10;  // device-wide Usage & diagnostics (Settings.Global multi_cb): user 0's choice, or all users' on headless-system-user devices
}

enum WhitelistKey {
	UNKNOWN=0;
	NO_WHITELIST=1;
	PLAYPASS=2;
}

message ConsentInformationWrapper {
	optional ConsentInformation consentInformation=1;
	repeated WhitelistKey whitelistKeys=2; // allowlists this log source's matching consent rule grants
	optional int32 userCount=15; // GMS 21.48 only, when flag set_user_count (default false): Android users on the device
}
