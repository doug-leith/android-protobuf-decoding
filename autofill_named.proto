// Field-type detection for one fill request (aukp, DetectorMetricsDecorator).
message FieldDetectionEvent {  // auqu
  int64 latency_ms = 3;  // estimated name (high): hoyz stopwatch around the detector call, TimeUnit.MILLISECONDS; time the detectors took
  repeated DetectedForm detected_form = 4;  // estimated name (high): augs.f(aszy) per DetectedForm
  int32 ignored_field_count = 6;  // estimated name (medium): size of atad.c + atad.d (two sets of the detector result; DetectedForm toString has unknownOrIgnoredFields)
  int32 detector_kind = 7;  // enum; class not recovered; estimated name (low): always 1 (both writers in aukp)
  SessionContext session = 8;  // estimated name (high): augs.b(MetricsContext)
  repeated PredictionProcessorTrace prediction_processor_trace = 9;  // estimated name (high): from atgw, whose toString() is PredictionProcessorTrace
  repeated FingerprintMatch fingerprint_match = 10;  // estimated name (medium): autj built from a field's fingerprint matched to the window fingerprint (ataj)
  bool has_focused_field_fingerprint = 11;  // estimated name (low): set when a DetectedForm's aszy.e (aszs, a field+fingerprint) is present, behind flag jhjz.u()
  repeated ChromeProcessorTrace chrome_processor_trace = 12;  // estimated name (high): aukp.b(atfm), atfm.toString() ChromeProcessorTrace
}

message DataSourceOperationEvent {  // aupt
  DataSourceOperation operation = 1;  // estimated name (high): 1 in auke.a (asmp.a fetch, auka.java:97), 2 in auke.b (asmp.b save, aujy)
  repeated DataType data_types = 3;  // estimated name (high): asmg.c requested DataTypes on fetch (auka.java:149); the saved object's DataType on save (aujy cN)
  int64 latency_ms = 4;  // estimated name (high): hoyz stopwatch .a(MILLISECONDS) around the data-source call (auka.java:153)
  bool success = 5;  // estimated name (high): true when the future succeeded, false on ExecutionException (auka, aujy, avev)
  int32 result_count = 6;  // estimated name (high): asml.a.size() = number of results fetched (auka.java:64, avev.java:837); 1/0 on save
  bool via_cache = 7;  // estimated name (medium): auke.e, true only for the auke that wraps asmz (DataSourceWithCache, cache dir data_source_cache/) in aual.java:50
  SessionContext session = 8;  // estimated name (high): augs.b(MetricsContext)
  int32 api_status_code = 9;  // estimated name (high): auke.d(): ApiException (bkzv).b() status code of the cause, else 0
  PaymentCardSaveResult payment_card_save_result = 10;  // estimated name (high): aupn from asmo.c / asme.a, logged with 'Payment save failed.' (aujy)
  DataSource data_source = 11;  // estimated name (high): auke.d DataSource (auta)
  repeated FilteredEntry filtered_entries = 12;  // estimated name (high): asml.c list of aupk built by valuable/entity filters (asqu, asxu, awtf)
  bool timed_out = 13;  // estimated name (high): set when the ExecutionException cause is TimeoutException (auka.java:81)
  int64 timeout_ms = 14;  // estimated name (high): auke.f, the hvrl.r() timeout in ms applied to the call (auke.a)
  PersonalContextResult personal_context_result = 15;  // estimated name (high): aupq from asmi PersonalContextResult (auka.java:182-242)
  ValuableSaveResult valuable_save_result = 16;  // estimated name (high): aupr from asmo.d / asmd.a, logged with 'Valuable save failed.' (aujy)
  WalletValuableResult wallet_valuable_result = 17;  // estimated name (high): aups from asmk WalletValuableResult (auka.java:245)
}

