edition = "2023";

// The AUTOFILL_WITH_GOOGLE Clearcut log source: metrics from Google Play services'
// Autofill service (com.google.android.gms.autofill, the system AutofillService
// AutofillChimeraService). Each event carries the session context: the foreground
// app (package, version code, signing-certificate hash) and activity class that
// asked for autofill, for any app on the phone.
// Schema from GMS 26.31.31 (the Pixel 8 build, dex files 1 and 5; obfuscated class
// names in comments), the outer LogEvent as in client_logging_named.proto. Names are
// from the code that sets each field; "estimated name" marks names the code does
// not settle. Unnamed messages keep their class name, unnamed fields are f<number>.

option features.utf8_validation = NONE;

message Autofill_LogEntry {  // crai (GMS)
  int64 currentTimeMillis = 1;
  string packageName = 2;
  repeated craj keyValuePairList = 3;
  AutofillEvent autofill_event = 6;  // wire type bytes; its one set field is the event, numbered as eventId (11)
  int32 eventId = 11;
  int64 eventFlowId = 12;
  sint64 timeZoneOffset = 15;
  ExperimentIds experiment_ids = 16;
  int64 elapsedRealtime = 17;
  bytes veProducerByteString = 18;
  crah_a f19 = 19;
  repeated int32 f20 = 20 [features.repeated_field_encoding = EXPANDED];
  int64 bootCount = 22;
  NetworkConnectionInfo network_connection_info = 23;
  bool notDirectBootMode = 25;
  double applied_sampling_rate = 30;  // only sent when flag ClearcutLogOperation__applied_sampling_rate is on; 1 = not sampled
}

// One event per LogEvent: AutofillChimeraService's logger (aujt, log tag ClearcutEventLogger)
// sets the field whose number is the LogEvent's eventId (11). Event names are estimated
// from the class that builds each event (its log tag in brackets) unless marked otherwise.
message AutofillEvent {  // ausx
  FieldDetectionEvent field_detection = 1;  // estimated name (high): aukp (DetectorMetricsDecorator) builds it from the detectors' result
  DataSourceOperationEvent data_source_operation = 2;  // estimated name (high): aupt built only by auke (DataSourceMetricsWrapper) aujy/auka and avev for every data-source fetch/save
  SaveShownEvent save_shown = 5;  // estimated name (high): avco handles FillEventHistory TYPE_SAVE_SHOWN (case 3)
  SaveUiActionEvent save_ui_action = 6;  // estimated name (medium): ausg is the save_ui_action_event_extra (RejectSavePromoOperation.java:66); built in SaveHandlerImpl + *SaveInfoFactory*
  ActivityFinishedEvent activity_finished = 7;  // estimated name (medium): auhb (activity tracker) logs auor once, when an Autofill activity finishes (avsw.b/e)
  CredentialWarningEvent credential_warning = 8;  // estimated name (high): aupi built by CredentialWarningActivityController (avwq) / CredentialIntentsUtils (awpa)
  CredentialPickedEvent credential_picked = 9;  // estimated name (medium): aurc logged when the user picks a credential in the pwm picker (DataIntentActivityController, CredentialsBottomSheetActivityController)
  auqv f10 = 10;  // no fields in this build
  FillRequestEvent fill_request = 11;  // estimated name (high): AutofillChimeraService.a(auye) builds it when the onFillRequest() callback is answered
  FillDatasetsEvent fill_datasets = 12;  // estimated name (medium) [OnboardingFillHandlerImpl, FillHandlerImpl]
  DatasetSelectedEvent dataset_selected = 13;  // estimated name (high): avco.e() matches the TYPE_DATASET_SELECTED event's dataset id
  FilledFieldsChangedEvent filled_fields_changed = 14;  // estimated name (medium): context committed, autofilled fields the user changed [EventHandlerImpl]
  auqg f15 = 15;  // no fields in this build
  aurz f16 = 16;  // no fields in this build
  aurm f17 = 17;  // no fields in this build
  SetupAccountSelectedEvent setup_account_selected = 19;  // estimated name (high): ausq logged in onItemSelected of the account spinner (SetupActivityController awfq, AccountSetupActivityController avvb)
  PendingRequestDroppedEvent pending_request_dropped = 20;  // estimated name (medium): AutofillChimeraService.onDisconnected() logs each fill/save request still pending
  AutofillEnabledChangedEvent autofill_enabled_changed = 21;  // estimated name (high): aupb logged when settings close and the autofill_enabled pref differs from its value at open (awne.onDestroy, awfh.h)
  PaymentFixFlowEvent payment_fix_flow = 22;  // estimated name (medium) [PaymentFixFlowActivityController]
  SettingsMigrationEvent settings_migration = 23;  // estimated name (high): avmc (SettingsMigrationHelperImpl).a()
  ImproveAutofillEvent improve_autofill = 24;  // estimated name (medium) [ImproveAutofillController]
  PasswordGenerationEvent password_generation = 25;  // estimated name (high) [PasswordGenerationActivityController]
  AccountSetupEvent account_setup = 26;  // estimated name (low) [SaveSetupActivityController, SetupActivityController]
  ausj f27 = 27;  // no fields in this build
  PasswordLeakCheckEvent password_leak_check = 28;  // estimated name (medium): auro built by PasswordBreachDetectionActivityController, SaveHandlerImpl ('Password breach check failed.'), CredentialSaveHandler; has latency and leak result
  LocalFixAddedEvent local_fix_added = 29;  // estimated name (medium): auqz from atqm.g(): fields newly added as local-fix candidates or promoted to active fixes (avco.java:1308,1600); pairs with 30 local_fix_removed
  LocalFixRemovedEvent local_fix_removed = 30;  // estimated name (medium): has a removal cause (aura)
  WebDomainIconFetchEvent web_domain_icon_fetch = 31;  // estimated name (medium) [WebDomainIconManager]
  SettingsSyncEvent settings_sync = 32;  // estimated name (medium) [SettingsProtoDataStore]
  BreachCheckSkipEvent breach_check_skip = 33;  // estimated name (medium): ausc built only in CredentialIntentsUtils.a() when a breach-check skip pass is valid (awpa.java:30-57)
  NoSaveUiEvent no_save_ui = 34;  // estimated name (high): avco, TYPE_CONTEXT_COMMITTED with getNoSaveUiReason()
  UploadFileStagedEvent upload_file_staged = 35;  // estimated name (high): atlh (ScottyFileUploader).f() writes the file to autofill_upload_cache/
  UploadCacheFlushEvent upload_cache_flush = 36;  // estimated name (high): atlh.k() counts the cache folder's uploads
  SnackbarShownEvent snackbar_shown = 37;  // estimated name (high): aust logged via augr.ak() right after the Snackbar view is added to the window [PaymentsAuthActivityController] awce.java:471-484
  SnackbarActionClickedEvent snackbar_action_clicked = 38;  // estimated name (high): auss logged in the snackbar action button's onClick before starting snackbar.a() intent, awce.java:437-456
  CardFieldCopiedEvent card_field_copied = 39;  // estimated name (high): logged when a card field chip is copied to ClipboardManager in the unmasked-card bottom sheet (awoi, UnmaskedCardPaymentsBottomSheetItem)
  PasswordBreachDialogEvent password_breach_dialog = 40;  // estimated name (high): avzb/avzl dialog for a breached Credential; aspe.g() 'Cannot mute breach when flag muteBreachAlertDialog is false' aspe.java:231; dialog code 1901 avtd.java:57
  PasswordTimestampMigrationEvent password_timestamp_migration = 41;  // estimated name (medium): asqc task rewrites password timestamps (iuie.k) from Unix to Windows epoch (+11644473600000000 us, awrd.a) and logs counts
  FillEventHistoryEvent fill_event_history = 42;  // estimated name (medium): the FillEventHistory event types of a session [EventHandlerImpl]
  DatasetsShownEvent datasets_shown = 43;  // estimated name (medium): FillEventHistory TYPE_DATASETS_SHOWN [EventHandlerImpl]
  PaymentsFollowUpIntentEvent payments_follow_up_intent = 44;  // estimated name (low): logged in awqk.k() when a GetRealPanCallback/save-card follow-up item (ivyl type 2) yields a wallet intent (ggbg); old name came from an unrelated warmUpPaymentsUi trace
  ManuallyFilledFieldsEvent manually_filled_fields = 45;  // estimated name (medium): context committed, fields the user typed in [EventHandlerImpl]
  FixAutofillLabelingEvent fix_autofill_labeling = 46;  // estimated name (medium): FixAutofillSetupActivityController (awiy) user field labeling; logged after 'Finished labeling' awix.java:20
  FormDataTypesEvent form_data_types = 47;  // estimated name (medium): awpw.j() logs the data types the form's data sources handle and which one SaveInfo uses, from FillHandlerImpl avdx.java:582
  PaymentCardSaveDialogEvent payment_card_save_dialog = 48;  // estimated name (medium): awco save-card dialog (STATE_PAYMENT_SAVE_CARD_START_TIME, 'Payments save card nextActivityFuture failed' awcn)
  ChromesyncMarkStaleEvent chromesync_mark_stale = 49;  // estimated name (medium): astw/astz tasks call asng.d() = ChromeSync markStale (astc.java:2108 'markStale API call for AUTOFILL_WALLET')
  CardArtDownloadEvent card_art_download = 50;  // estimated name (medium): avtj callback of avtk.g() image download, logs 'Failed to download card art for URL' [CardArtManager]
  CardArtFetchEvent card_art_fetch = 51;  // estimated name (medium): avti callback of avtk.a() (trace autofill-CardArtManager_fetchIconForCard) [CardArtManager]
  PaymentCardSaveInfoSkippedEvent payment_card_save_info_skipped = 52;  // estimated name (medium): auvp.k() logged only on early-return paths of PaymentCardSaveInfoFactoryV2 that create no SaveInfo
  SavePasswordUsernameDialogEvent save_password_username_dialog = 53;  // estimated name (medium): SavePasswordActivityController (awem) dialog asking for a username, with common-username chips ('Populating common usernames failed' awel)
  FillCallbackFailureEvent fill_callback_failure = 54;  // estimated name (high): AutofillChimeraService.a(): FillCallback.onSuccess() threw
  ausr f55 = 55;  // no fields in this build
  FillPluginSkippedEvent fill_plugin_skipped = 56;  // estimated name (medium): avis.c() logged when SmsOtpFillPlugin declines to fill; plugin = autg.SMS_OTP avis.java:63
  AuthAndFillResultEvent auth_and_fill_result = 57;  // estimated name (medium) [AuthAndFillActivityController, PaymentsAuthActivityController, ...]; has the result (aupw)
  AccountMetadataUpdateEvent account_metadata_update = 58;  // estimated name (medium) [AccountMetadataUpdateTask]
  ImeSuggestionEvent ime_suggestion = 59;  // estimated name (medium) [AutofillImeCoreServiceImpl]: keyboard (inline) suggestion UI, with action auoy
  HatsSurveyEvent hats_survey = 60;  // estimated name (high) [HatsActivityController]
  SettingsSwitchToggleEvent settings_switch_toggle = 61;  // estimated name (high): awmr (PreferencesFragment) logs ausm for payment_info/credentials/cvc/inline_suggestion/sync_settings switches, not just sync
  StoredCvcDeletionEvent stored_cvc_deletion = 62;  // estimated name (medium): awmj logs aupj after deleting stored wallet CVCs ("Unable to delete stored wallet credentials"), hides cvc_switch
  SaveInfoCreationEvent save_info_creation = 63;  // estimated name (medium) [CredentialSaveInfoFactory, PaymentCardSaveInfoFactoryV2, ValuableSaveInfoFactory]
  StringRebuildEvent string_rebuild = 64;  // estimated name (medium): aujx tag "StringRebuildLogger", logged from FillHandlerImpl (avdx:166) when its node count > 0
  SettingsBackupEvent settings_backup = 65;  // estimated name (medium): settings backup agent (auzo)
  CentralizedFillEvent centralized_fill = 66;  // estimated name (low) [CentralizedFillerImpl]
  ReauthSettingEvent reauth_setting = 67;  // estimated name (medium) [ReauthSettingManager]
  CardOcrEvent card_ocr = 68;  // estimated name (medium): card OCR intent (awew)
  PersonalContextSpiiFillEvent personal_context_spii_fill = 69;  // estimated name (medium): awdw log "not logging personal context spii fill event"
  BillingCustomerNumberCacheLookupEvent billing_customer_number_cache_lookup = 70;  // estimated name (medium): asdf (AccountDataImpl).a()/b(): cached billing customer number read from avow.w()
  StrikeDatabaseUpdateEvent strike_database_update = 71;  // estimated name (medium): avsp add/clear/decay strike counter; avkq "Missing required StrikeDb"
  MoreInfoEvent more_info = 72;  // estimated name (medium) [MoreInfoActivityController]
  BillingCustomerNumberFetchEvent billing_customer_number_fetch = 73;  // estimated name (medium): asdf.h(): billing customer number fetched from WalletApi ("Failed to fetch billing customer number")
