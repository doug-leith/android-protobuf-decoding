edition = "2023";

// Google Play services' sensor-collection upload: the request of
// google.internal.android.location.kollektomat.v1.KollektomatService/Offer
// (android-context-data.googleapis.com, gRPC). It carries an lbs.GLocRequest in a
// google.protobuf.Any: Wi-Fi scans (BSSID, RSSI, frequency, SSID hash), cell scans,
// location fixes, raw sensor samples (accelerometer, gyroscope, magnetometer,
// barometer, ...), GNSS satellite status and raw GNSS measurements, screen/charging
// and Bluetooth events. Schema from GMS 24.06.16 (Pixel 8 Sep 2024 factory image,
// dex 8 and 9; obfuscated class names in comments). Names are from the code that
// fills each field (GLocRequestComposer dvwd and the scanners in
// com.google.android.location.collectionlib); "estimated name" marks each with its
// evidence. Unnamed messages keep their class name, unnamed fields are f<number>.

option features.utf8_validation = NONE;

// request of google.internal.android.location.kollektomat.v1.KollektomatService/Offer (dvmk.b: method descriptor built with esqb/esqc)
message KollektomatOfferRequest {  // esqb
  AnyGLocRequest payload = 1;  // estimated name (high): google.protobuf.Any (ezgz) holding the GLocRequest bytes; dxdb sets type_url type.googleapis.com/lbs.GLocRequest
  repeated string collector = 2;  // estimated name (high): dxdb: PASSIVE_COLLECTOR / BURST_COLLECTOR / SENSOR_COLLECTOR lower-cased ("sensor_collector"); the Earthquake Alerts path (dxlr.b) sends "gls-indoor-upload"
}

// google.protobuf.Any (ezgz) with its value typed as the GLocRequest it carries
message AnyGLocRequest {
  string type_url = 1;  // "type.googleapis.com/lbs.GLocRequest"
  GLocRequest value = 2;
}

// the Any payload, type_url type.googleapis.com/lbs.GLocRequest; built by the sensor collector's GLocRequestComposer dvwd (and by the passive/burst collectors, dvzp)
message GLocRequest {  // esaq
  Header header = 1;  // estimated name (high): erzb built in dvwd.J()
  repeated ClientId client = 2;  // estimated name (high): eryx "sglclt/<package>"
  erzf f3 = 3;
  repeated LocationSignals signals = 4;  // estimated name (medium): LocRequest.signals in locm.proto; dvwd adds one LocationSignals per chunk
  UploadInfo upload_info = 6;  // estimated name (medium): esar built per chunk in dvwd.y()
}

// dvwd.J()
message Header {  // erzb
  string version = 1;  // estimated name (medium): constant "1.0" (dvwd.J())
  string build_fingerprint = 2;  // estimated name (high): dvwx.a = "android/" + Build.FINGERPRINT; the Earthquake Alerts path (dxlr.e) sends Build.MANUFACTURER, BRAND/DEVICE or FINGERPRINT as a flag says
  string gls_id = 3;  // estimated name (low): locm.proto's glsID; not set by this build's composer
  string locale = 5;  // estimated name (high): Locale.getDefault().toString()
  string gms_version = 9;  // estimated name (low): dxlr.e (Earthquake Alerts): Integer.toString(albd.f()), a cached GMS build int (akww.a)
  string timezone = 11;  // estimated name (high): TimeZone.getDefault().getID()
  AudioConfig audio_config = 12;  // estimated name (medium): erze from dvwd.B()/C(), only when raw audio is collected
  string gnss_hardware_model = 13;  // estimated name (high): LocationManager.getGnssHardwareModelName() (hgg.b), "no_gnss_hardware" or "unknown" otherwise
}

// dvwd.J(): String.format("%s/%s", "sglclt", packageName)
message ClientId {  // eryx
  string name = 1;  // estimated name (high): "sglclt/" + Context.getPackageName()
}

message erzf {  // erzf
  string f1 = 1;
}

// one collection: cell, Wi-Fi, location fix and the sensor trace (same message as LocRequest.Location in locm.proto)
message LocationSignals {  // eryu
  CellScan cell_scan = 1;  // estimated name (high): eryp (locm.proto cellSignals)
  WifiScan wifi_scan = 2;  // estimated name (high): esam (locm.proto wifiSignals)
  Location location = 3;  // estimated name (high): erza (locm.proto gpsInfo)
  eryv f4 = 4;
  repeated int32 payload_type = 6 [features.repeated_field_encoding = EXPANDED];  // estimated name (low): dxlr.e adds 6 with an Earthquake Alerts record in field 7
  repeated bytes payload = 7;  // estimated name (medium): dxlr.e: serialized eryg (Earthquake Alerts "ResRep" record built in dxoe: three Locations, times, flags)
  SensorTrace sensor_trace = 9;  // estimated name (high): esad, set in dvwd.f() when any scanner list is non-empty
  int32 f10 = 10;
  sint64 f14 = 14;
  erxx f18 = 18;
  ActivityRecognitionResult activity = 19;  // estimated name (high): erww from activity recognition (locm.proto detectedActivities)
  int32 skipped_accelerometer_samples = 20;  // estimated name (medium): dvwd.y(): count of accelerometer events dropped by SensorScanner for being < 10 ms after the previous one (z())
  int32 skipped_gyroscope_samples = 21;  // estimated name (medium): dvwd.y(): count of gyroscope events < 6.67 ms after the previous one (A())
  CollectionInfo collection_info = 99;  // estimated name (medium): eryt (dydx.a, dvwd.H)
}

// dvwd.y(): one per uploaded chunk
message UploadInfo {  // esar
  int64 request_time_ms = 1;  // estimated name (high): dvwd.G(): wall-clock ms (elapsedRealtime + boot offset) when the chunk was closed
  string session_id = 2;  // estimated name (high): "@" + [flag ndp_ln + "-"] + UUID.randomUUID(), one per collection; Earthquake Alerts: "@" or "@debug." + UUID
  int32 chunk_number = 3;  // estimated name (high): dvwd.y(): 1, 2, ... for each chunk, 0 for the last one (x(): collection finished)
  int64 collection_start_time_ms = 4;  // estimated name (high): dvwe.g() (first elapsedRealtime) + boot offset: wall-clock start of the collection
}

// dvwd.B()/C()
message AudioConfig {  // erze
  AudioSource audio_source = 1;  // estimated name (high): dvwd.B: "Audio source: %d is not valid.", erzd = MediaRecorder.AudioSource 0-9
  int32 f2 = 2;
  int32 f3 = 3;
  int32 f4 = 4;
  int32 f5 = 5;
}

// dvwd.g(), dvzp.C()
message CellScan {  // eryp
  CellInfo primary_cell = 1;  // estimated name (high): serving cell (locm.proto primaryCell)
  int64 time_ms = 2;  // estimated name (high): dvwd.g(): elapsedRealtime ms - collection start; dvzp: absolute ms
  repeated CellInfo neighbor_cells = 3;  // estimated name (high): dwct.g neighbours (locm.proto neighbor)
}

// dvwd.w(List<ScanResult>, List<RangingResult>)
message WifiScan {  // esam
  int64 time_ms = 1;  // estimated name (high): scan time (elapsedRealtime ms) - collection start
  repeated WifiAccessPoint access_point = 2;  // estimated name (high): one per ScanResult
  int64 rtt_time_ms = 6;  // estimated name (medium): time of the RangingResults list - collection start, set when one is passed
}

// dwbi.c(Location, source, time), dvzp.C()
message Location {  // erza
  LatLngE7 lat_lng = 1;  // estimated name (high): Location.getLatitude/getLongitude
  int32 accuracy_m = 3;  // estimated name (high): (int) Location.getAccuracy()
  int64 time_ms = 6;  // estimated name (high): dvwd.E: elapsedRealtime ms - collection start; dvzp: bish.g()
  LocationSource source = 8;  // estimated name (high): dvwd.E: provider "gps" -> 0, "fused" -> 5, other -> 15; dvzp: 0
  int32 altitude_m = 10;  // estimated name (high): (int) Location.getAltitude()
  int32 bearing_deg = 13;  // estimated name (high): (int) Location.getBearing()
  float speed_mps = 16;  // estimated name (high): Location.getSpeed()
  bool battery_charging = 17;  // estimated name (low): locm.proto's name; dvzp sets it from a collector boolean (BurstCollector this.m)
  float altitude_m_float = 23;  // estimated name (high): (float) Location.getAltitude()
}

message eryv {  // eryv
  erzi f3 = 3;
}

// the collected signals; each repeated field is one scanner, filled by the GLocRequestComposer method named in its note
message SensorTrace {  // esad
  int64 start_offset_ns = 1;  // estimated name (medium): dvwe.a(): ns from the collection start to this chunk's first sample; each scanner's first sample is relative to it
  repeated OrientationSample orientation = 2;  // estimated name (high): TYPE_ORIENTATION samples (dvwd.r)
  repeated AccelerometerSample accelerometer = 3;  // estimated name (high): TYPE_ACCELEROMETER samples (dvwd.b)
  repeated GyroscopeSample gyroscope = 4;  // estimated name (high): TYPE_GYROSCOPE samples (dvwd.m)
  repeated MagneticFieldSample magnetic_field = 5;  // estimated name (high): TYPE_MAGNETIC_FIELD samples (dvwd.q)
  repeated CellScan cell_scan = 6;  // estimated name (high): dvwd.g()
  repeated WifiScan wifi_scan = 7;  // estimated name (high): dvwd.w()
  repeated Location location = 8;  // estimated name (high): dvwd.E(Location): GPS / fused fixes (esac.a)
  MagneticFieldSample geomagnetic_field_model = 9;  // estimated name (high): dvwd.D() from dvwi: new GeomagneticField(lat, lng, alt, now) getX/Y/Z/Declination at the first GPS fix
  repeated erxu f10 = 10;
  repeated BarometerSample barometer = 11;  // estimated name (high): TYPE_PRESSURE samples (dvwd.d)
  repeated UncalibratedMagneticFieldSample uncalibrated_magnetic_field = 12;  // estimated name (high): TYPE_MAGNETIC_FIELD_UNCALIBRATED samples (dvwd.v)
  repeated LightSample light = 13;  // estimated name (high): TYPE_LIGHT samples (dvwd.p)
  repeated ProximitySample proximity = 14;  // estimated name (high): TYPE_PROXIMITY samples (dvwd.s)
  repeated SoundFeatures sound_features = 15;  // estimated name (high): dvwd.t()
  repeated HeartRateSample heart_rate = 16;  // estimated name (high): TYPE_HEART_RATE samples (dvwd.o)
  repeated StepCounterSample step_counter = 17;  // estimated name (high): TYPE_STEP_COUNTER samples (dvwd.u)
  repeated DeviceStateEvent device_state = 18;  // estimated name (high): dvwd.i()
  repeated GnssMeasurementsRecord gnss_measurements = 19;  // estimated name (high): dvwd.j(GnssMeasurementsEvent)
  repeated BluetoothDeviceEvent bluetooth_device = 20;  // estimated name (high): dvwd.F()
  repeated BluetoothAdapterStateEvent bluetooth_adapter_state = 21;  // estimated name (high): dvwd.e()
  repeated HeartPpgSample heart_ppg = 23;  // estimated name (high): sensor type 65541 samples (dvwd.n)
  repeated RawAudioFrame raw_audio = 24;  // estimated name (high): dvwd.h()
  int32 gyroscope_sampling_period_us = 25;  // estimated name (medium): dvwd.H(): RealCollectorConfig.a(GYROSCOPE), the SensorDelay set by dwaw.R() (10000 in the captures)
  repeated GnssStatusRecord gnss_status = 26;  // estimated name (high): dvwd.l(GnssStatus)
  int32 wifi_scan_delay_ms = 27;  // estimated name (high): dvwd.H(): flsd.b() = flag sensor_collection_wifi_scan_delay_ms (default 2000)
}

message erxx {  // erxx
  erxz f5 = 5;
  erxv f8 = 8;
}

// dvzp.C(): activity recognition result dvjc (same as LocRequest.Location.DetectedActivityWrappper in locm.proto)
message ActivityRecognitionResult {  // erww
  uint64 time_ms = 1;  // estimated name (high): dvjc.c + clock offset (locm.proto timestamp)
  repeated DetectedActivity detected_activity = 2;  // estimated name (high): dvjc.a list
  int32 detector_info_id = 3;  // estimated name (low): dvjc.d; locm.proto's name
}

// dvwd.H(), dvzp.C()
message CollectionInfo {  // eryt
  int32 trigger = 1;  // estimated name (medium): dwaw.S(): 14 ON_FOOT seen in the last 30 s, 22 IN_VEHICLE, 20 forced, 23 other; BurstCollector 6/8/9/10/17/19
  repeated string experiment_tag = 5;  // estimated name (low): flag ndp_ln (dydx.a), also the session id's prefix
  int32 burst_config_value = 8;  // estimated name (low): dvzp.C i2 = this.b.t().a()
  CollectionFlags flags = 9;  // estimated name (high): eryq
}

// dvwd.g() (CellLocation), dwcq.a() (CellInfo* via dwct subclasses built in dxcs/dxfc)
message CellInfo {  // eryo
  int32 lac = 1;  // estimated name (high): GsmCellLocation.getLac(), CDMA getNetworkId(), dwcy/dwco .a
  int32 cell_id = 2;  // estimated name (high): getCid() / getBaseStationId() / CellIdentityLte.getCi()
  int32 mnc = 3;  // estimated name (high): network operator substring(3), CDMA systemId
  int32 mcc = 4;  // estimated name (high): network operator substring(0,3)
  int32 signal_strength_dbm = 5;  // estimated name (high): dwcq: CellSignalStrength.getDbm() (-9999 = not set)
  int32 age_ms = 6;  // estimated name (medium): dwct.e(): collection time - CellInfo.getTimestampMillis()
  int32 timing_advance = 7;  // estimated name (high): CellSignalStrengthLte.getTimingAdvance() (dxcs -> dwdd.k)
  int32 primary_scrambling_code = 8;  // estimated name (medium): dwcy.j (locm.proto comment PrimaryScramblingCode = 8)
  LatLngE7 f9 = 9;
  CollectorRadioType radio_type = 10;  // estimated name (high): dwcq/dvwd: 3 GSM, 4 CDMA, 5 WCDMA, 6 LTE, 7 NR
  int32 physical_cell_id = 11;  // estimated name (high): CellIdentityLte/Nr.getPci() (dwdd.a, dwdg.a)
  int32 tracking_area_code = 12;  // estimated name (high): CellIdentityLte/Nr.getTac() (dwdd.j, dwdg.j)
  int64 nr_cell_id = 13;  // estimated name (high): CellIdentityNr.getNci() (dwdg.k)
}

// one ScanResult, dvwd.w() and dvzp.C()
message WifiAccessPoint {  // esak
  string f1_empty = 1;  // estimated name (low): esak.b() always sets "" (required field kept for old servers)
  int32 channel = 3;  // estimated name (high): dwea.c: esva.a(frequency) (2412 MHz -> 1, 5240 -> 48)
  int32 rssi_legacy = 4;  // estimated name (medium): dvzp: dwef.i() rssi (locm.proto rssi = 4); the sensor collector uses field 9
  int64 bssid = 8;  // estimated name (high): esva.b(ScanResult.BSSID): the MAC address as a 48-bit integer
  sint32 rssi_dbm = 9;  // estimated name (high): ScanResult.level
  WifiBand band = 11;  // estimated name (medium): dwea.c: 1 when the frequency is 5035-5990 MHz
  int32 age_ms = 12;  // estimated name (medium): dvzp: |scan time - AP time|
  repeated WifiRttRanging rtt = 19;  // estimated name (high): RangingResult for this BSSID
  uint32 ssid_hash = 23;  // estimated name (high): dwea.a(SSID): low 16 bits of Guava farmHashFingerprint64 (efxp) of the SSID; the SSID itself is not sent
  int32 frequency_mhz = 25;  // estimated name (high): ScanResult.frequency
  WifiResponderLocation responder_location = 26;  // estimated name (high): RangingResult.getUnverifiedResponderLocation()
  WifiInterworking interworking = 27;  // estimated name (high): information element 107
}

// dwbi.c: dkof.l(getLatitude()), dkof.l(getLongitude()) (degrees * 1e7)
message LatLngE7 {  // eryw
  sfixed32 lat_e7 = 1;  // estimated name (high): round(latitude * 1e7)
  sfixed32 lng_e7 = 2;  // estimated name (high): round(longitude * 1e7)
}

message erzi {  // erzi
  LatLngE7 f1 = 1;
  LatLngE7 f2 = 2;
}

// dvwd.r(): TYPE_ORIENTATION (3)
message OrientationSample {  // erzy
  float azimuth = 1;  // estimated name (high): SensorEvent.values[0]
  float pitch = 2;  // estimated name (high): SensorEvent.values[1]
  float roll = 3;  // estimated name (high): SensorEvent.values[2]
  int32 accuracy = 4;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 7;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 8;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 9;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 10;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.b(): SensorScanner sends Sensor.TYPE_ACCELEROMETER (1) here
message AccelerometerSample {  // erzj
  float x = 1;  // estimated name (high): SensorEvent.values[0]
  float y = 2;  // estimated name (high): SensorEvent.values[1]
  float z = 3;  // estimated name (high): SensorEvent.values[2]
  int32 accuracy = 4;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 7;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 8;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 9;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 10;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.m(): TYPE_GYROSCOPE (4)
message GyroscopeSample {  // erzt
  float x = 1;  // estimated name (high): SensorEvent.values[0]
  float y = 2;  // estimated name (high): SensorEvent.values[1]
  float z = 3;  // estimated name (high): SensorEvent.values[2]
  int32 accuracy = 4;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 7;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 8;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 9;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 10;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.q(): TYPE_MAGNETIC_FIELD (2); also dvwd.D() for the GeomagneticField model value
message MagneticFieldSample {  // erzx
  float x = 1;  // estimated name (high): SensorEvent.values[0]
  float y = 2;  // estimated name (high): SensorEvent.values[1]
  float z = 3;  // estimated name (high): SensorEvent.values[2]
  int32 accuracy = 4;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  float declination_deg = 7;  // estimated name (high): GeomagneticField.getDeclination() (only in SensorTrace.geomagnetic_field_model)
  int32 delta_us = 8;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 9;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 10;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 11;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

message erxu {  // erxu
  int32 f1 = 1;
  repeated erxt f2 = 2;
}

// dvwd.d(): TYPE_PRESSURE (6)
message BarometerSample {  // erzk
  float pressure_hpa = 1;  // estimated name (high): values[0] of TYPE_PRESSURE
  int32 accuracy = 2;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 3;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 4;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 5;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 6;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.v(): TYPE_MAGNETIC_FIELD_UNCALIBRATED (14), values[0..5]
message UncalibratedMagneticFieldSample {  // esag
  MagneticFieldSample sample = 1;  // estimated name (high): values[0..2] (uncalibrated x, y, z) with accuracy and timing, as a MagneticFieldSample
  float bias_x = 2;  // estimated name (high): values[3] (hard-iron bias estimate)
  float bias_y = 3;  // estimated name (high): values[4]
  float bias_z = 4;  // estimated name (high): values[5]
}

// dvwd.p(): TYPE_LIGHT (5)
message LightSample {  // erzw
  float lux = 1;  // estimated name (high): values[0] of TYPE_LIGHT
  int32 accuracy = 2;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 3;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 4;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 5;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 6;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.s(): TYPE_PROXIMITY (8)
message ProximitySample {  // erzz
  float distance_cm = 1;  // estimated name (high): values[0] of TYPE_PROXIMITY
  int32 accuracy = 2;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 3;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 4;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 5;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 6;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.t(): features computed on-device from microphone audio by dvya (dvxy)
message SoundFeatures {  // esae
  repeated double frame_stats = 1 [features.repeated_field_encoding = EXPANDED];  // estimated name (medium): dvya: [mean power, zero-crossing rate (Hz, 44.1 kHz/1024 frame), power std dev, spectral entropy (bits)]
  repeated double cepstral_coefficients = 2 [features.repeated_field_encoding = EXPANDED];  // estimated name (medium): dvya: 40 DCT coefficients of 40 filter-bank values (MFCC-like)
  repeated double band_means = 3 [features.repeated_field_encoding = EXPANDED];  // estimated name (medium): dvya: dvxz.b (mean) per band
  repeated double band_std_devs = 4 [features.repeated_field_encoding = EXPANDED];  // estimated name (medium): dvxz.c (standard deviation) per band
  repeated double band_entropies = 5 [features.repeated_field_encoding = EXPANDED];  // estimated name (medium): dvxz.a (entropy, bits) per band
  int32 time_ms = 6;  // estimated name (high): time - collection start
}

// dvwd.o(): TYPE_HEART_RATE (21)
message HeartRateSample {  // erzv
  float bpm = 1;  // estimated name (high): values[0] of TYPE_HEART_RATE
  int32 accuracy = 2;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 3;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 4;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 5;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 6;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.u(): TYPE_STEP_COUNTER (19)
message StepCounterSample {  // esaf
  float steps = 1;  // estimated name (high): values[0] of TYPE_STEP_COUNTER
  int32 accuracy = 2;  // estimated name (high): SensorEvent.accuracy, sent on the first sample and when it changes
  int32 delta_us = 3;  // estimated name (high): dvwg: (timestamp - previous sample's timestamp) / 1000; first sample: from SensorTrace.start_offset_ns
  int32 delta_ns_remainder = 4;  // estimated name (high): the same difference % 1000
  int64 timestamp_ns = 5;  // estimated name (high): SensorEvent.timestamp (ns since boot), first sample of the chunk only
  int64 elapsed_realtime_ns = 6;  // estimated name (high): SystemClock.elapsedRealtime() * 1e6 at delivery, first sample only
}

// dvwd.i(): collectionlib/DeviceStateScanner (screen, unlock and charging broadcasts)
message DeviceStateEvent {  // erzs
  DeviceState state = 1;  // estimated name (high): DeviceStateScanner codes 1-7
  int32 time_ms = 2;  // estimated name (high): elapsedRealtime - collection start
}

// dvwd.j(GnssMeasurementsEvent)
message GnssMeasurementsRecord {  // erxr
  int32 time_ms = 1;  // estimated name (high): elapsedRealtime - collection start
  GnssMeasurementsEvent event = 3;  // estimated name (high): dvwh.a(GnssMeasurementsEvent)
}

// dvwd.F(): collectionlib/BluetoothDeviceScanner ACL_* broadcasts, dxgv (BluetoothDevice)
message BluetoothDeviceEvent {  // erzm
  string name = 1;  // estimated name (high): BluetoothDevice.getName()
  int32 device_type = 2;  // estimated name (high): BluetoothDevice.getType()
  int32 device_class = 3;  // estimated name (high): BluetoothClass.getDeviceClass()
  int32 major_device_class = 4;  // estimated name (high): BluetoothClass.getMajorDeviceClass()
